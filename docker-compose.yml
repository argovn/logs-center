version: "3.9"

networks:
  log-net:
    driver: bridge

volumes:
  clickhouse-data:
  clickhouse-logs:
  grafana-data:

services:
  # ─────────────────────────────────────────
  # CLICKHOUSE - Storage & Analytics Engine
  # ─────────────────────────────────────────
  clickhouse:
    image: clickhouse/clickhouse-server:24.3
    container_name: clickhouse
    restart: unless-stopped
    ports:
      - "8123:8123"
      - "9000:9000"
    volumes:
      - clickhouse-data:/var/lib/clickhouse
      - clickhouse-logs:/var/log/clickhouse-server
      - ./clickhouse/init:/docker-entrypoint-initdb.d
      - ./clickhouse/config/config.xml:/etc/clickhouse-server/config.d/custom.xml
    environment:
      CLICKHOUSE_DB: logs_db
      CLICKHOUSE_USER: ${CLICKHOUSE_USER:-loguser}
      CLICKHOUSE_PASSWORD: ${CLICKHOUSE_PASSWORD:-secret123}
      CLICKHOUSE_DEFAULT_ACCESS_MANAGEMENT: 1
    ulimits:
      nofile:
        soft: 262144
        hard: 262144
    networks:
      - log-net
    healthcheck:
      test: ["CMD", "clickhouse-client", "--query", "SELECT 1"]
      interval: 10s
      timeout: 5s
      retries: 5

  # ─────────────────────────────────────────
  # VECTOR - Log Aggregator & Processor
  # ─────────────────────────────────────────
  vector:
    image: timberio/vector:0.39.0-alpine
    container_name: vector
    restart: unless-stopped
    ports:
      - "8686:8686"
      - "4317:4317"
      - "4318:4318"
      - "5044:5044"
      - "9514:9514/udp"
      - "9880:9880"
    volumes:
      - ./vector/vector.toml:/etc/vector/vector.toml:ro
    environment:
      CLICKHOUSE_USER: ${CLICKHOUSE_USER:-loguser}
      CLICKHOUSE_PASSWORD: ${CLICKHOUSE_PASSWORD:-secret123}
    depends_on:
      clickhouse:
        condition: service_healthy
    networks:
      - log-net

  # ─────────────────────────────────────────
  # OPENTELEMETRY COLLECTOR
  # ─────────────────────────────────────────
  otel-collector:
    image: otel/opentelemetry-collector-contrib:0.98.0
    container_name: otel-collector
    restart: unless-stopped
    ports:
      - "4319:4317"
      - "4320:4318"
      - "55679:55679"
    volumes:
      - ./otel-collector/config.yaml:/etc/otelcol-contrib/config.yaml:ro
    depends_on:
      - vector
    networks:
      - log-net

  # ─────────────────────────────────────────
  # GRAFANA - Visualization & Alerting
  # ─────────────────────────────────────────
  grafana:
    image: grafana/grafana:10.4.0
    container_name: grafana
    restart: unless-stopped
    ports:
      - "3000:3000"
    volumes:
      - grafana-data:/var/lib/grafana
      - ./grafana/provisioning:/etc/grafana/provisioning
    environment:
      GF_SECURITY_ADMIN_USER: ${GRAFANA_USER:-admin}
      GF_SECURITY_ADMIN_PASSWORD: ${GRAFANA_PASSWORD:-admin123}
      GF_INSTALL_PLUGINS: grafana-clickhouse-datasource
      GF_AUTH_ANONYMOUS_ENABLED: "false"
    depends_on:
      - clickhouse
    networks:
      - log-net

  # ─────────────────────────────────────────
  # DEMO APP - NodeJS
  # ─────────────────────────────────────────
  nodejs-app:
    build: ./apps/nodejs-app
    container_name: nodejs-app
    restart: unless-stopped
    environment:
      OTEL_EXPORTER_OTLP_ENDPOINT: http://otel-collector:4318
      OTEL_SERVICE_NAME: nodejs-app
      APP_ENV: production
    depends_on:
      - otel-collector
    networks:
      - log-net

  # ─────────────────────────────────────────
  # DEMO APP - Python
  # ─────────────────────────────────────────
  python-app:
    build: ./apps/python-app
    container_name: python-app
    restart: unless-stopped
    environment:
      OTEL_EXPORTER_OTLP_ENDPOINT: http://otel-collector:4318
      OTEL_SERVICE_NAME: python-app
      APP_ENV: production
    depends_on:
      - otel-collector
    networks:
      - log-net
